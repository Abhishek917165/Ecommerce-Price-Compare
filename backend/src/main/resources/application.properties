# Server configuration
server.port=8080

# Application Name
spring.application.name=compare

# -------------------------------------------------------------
# DATABASE CONFIGURATION: In-Memory H2 Database (DEFAULT - Zero Setup)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:compare_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console for manual database validation
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------
# ALTERNATE DATABASE CONFIGURATION: MySQL (Uncomment to switch)
# -------------------------------------------------------------
# Before uncommenting, create the database in MySQL: "CREATE DATABASE ecommerce_compare;"
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_compare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA Common Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Upload settings for product images (if saved locally)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
